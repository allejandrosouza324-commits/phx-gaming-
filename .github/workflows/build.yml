name: PHX APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract PHX
        run: unzip -o PHX_GAMING_ENGINE_GitHub_Build.zip -d .

      - name: Compile APK
        run: gradle --no-daemon -p PHX_GAMING_ENGINE assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PHX-GAMING-ENGINE
          path: PHX_GAMING_ENGINE/app/build/outputs/apk/debug/app-debug.apk
